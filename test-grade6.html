<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار الدراسات الاجتماعية – الصف السادس</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--brown:#7a4a26;--sand:#f6ecdc;--sand2:#efe0c6;--green:#1f6f4a;--red:#b23a2e;--ink:#2e2218;--line:#d9c3a0}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;background:var(--sand);color:var(--ink);line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 120px}
.head{background:#fffaf2;border:2px solid var(--line);border-radius:18px;padding:16px 18px;position:relative;overflow:hidden}
.head:before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:repeating-linear-gradient(90deg,var(--brown) 0 18px,var(--sand2) 18px 24px,var(--green) 24px 42px,var(--sand2) 42px 48px)}
.title{text-align:center;margin:8px 0 12px}
.title h1{margin:0;font-size:1.45rem;color:var(--brown)}
.title p{margin:2px 0 0;font-size:.98rem;color:#6b5843}
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info label{display:flex;flex-direction:column;font-weight:700;font-size:.92rem;color:var(--brown)}
.info input,.info select{font:inherit;font-weight:500;margin-top:4px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.info .ro{padding:9px 12px;margin-top:4px;background:var(--sand2);border-radius:10px;font-weight:500;color:var(--ink)}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:.92rem}
.meta span{background:var(--sand2);padding:4px 12px;border-radius:999px}
.timer{position:sticky;top:0;z-index:20;display:flex;justify-content:center;padding:8px 0;background:linear-gradient(var(--sand) 70%,transparent)}
.timer div{background:var(--green);color:#fff;font-weight:800;font-size:1.15rem;padding:6px 22px;border-radius:999px;box-shadow:0 3px 10px #0002;direction:ltr}
.timer div.warn{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.q{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:18px}
.q h2{margin:0 0 10px;font-size:1.15rem;color:#fff;background:var(--brown);display:inline-block;padding:4px 16px;border-radius:10px}
.q h2 small{font-weight:500;opacity:.9}
.item{border-top:1px dashed var(--line);padding:14px 0}
.item:first-of-type{border-top:0}
.stem{font-weight:700;margin-bottom:8px;display:flex;gap:8px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--sand2);color:var(--brown);display:grid;place-items:center;font-size:.9rem}
.item img{display:block;max-width:100%;width:340px;border-radius:12px;margin:4px auto 10px;border:3px solid var(--sand2)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;text-align:center;cursor:pointer;background:#fffdf9;user-select:none;transition:.15s}
.opt:hover{border-color:var(--brown)}
.opt.sel{background:var(--brown);color:#fff;border-color:var(--brown)}
.tf{display:flex;gap:10px}
.tf .opt{flex:0 0 110px}
.match{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.match select{font:inherit;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);min-width:170px;background:#fff}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:var(--sand);border:2px dashed var(--line);border-radius:14px;padding:12px;margin-bottom:6px;min-height:58px}
.bank-t{text-align:center;font-size:.85rem;color:#6b5843;margin-bottom:4px}
.chip{background:var(--green);color:#fff;font-weight:700;padding:6px 16px;border-radius:999px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 2px 6px #0002}
.chip.pick{outline:3px solid #e8a33d}
.chip.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.9;transform:scale(1.08)}
.dragrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.slot{min-width:150px;min-height:40px;border:2px dashed var(--brown);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:3px;background:#fffdf9;color:#a08a70;font-size:.85rem}
.slot.over{background:#fff0d6}
.slot .chip{cursor:pointer}
.line{width:100%;font:inherit;padding:9px 12px;border:none;border-bottom:2px dotted var(--brown);background:#fffdf9;border-radius:8px 8px 0 0}
.line:focus{outline:none;background:#fff6e6}
.ok{background:#e3f3ea!important;border-color:var(--green)!important;color:var(--green)!important}
.bad{background:#fbe6e3!important;border-color:var(--red)!important;color:var(--red)!important}
.fb{font-size:.9rem;margin-top:6px;font-weight:700}
.fb.g{color:var(--green)}.fb.r{color:var(--red)}
.send{display:block;margin:26px auto 0;font:inherit;font-weight:800;font-size:1.15rem;background:var(--green);color:#fff;border:none;border-radius:14px;padding:12px 44px;cursor:pointer;box-shadow:0 4px 12px #0003}
.send:disabled{opacity:.5;cursor:default}
.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:50;padding:14px}
.modal.on{display:grid}
.box{background:#fffaf2;border-radius:18px;max-width:420px;width:100%;padding:20px;text-align:center;border:2px solid var(--line)}
.box h3{margin:0 0 8px;color:var(--brown)}
.box .btns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.box button{font:inherit;font-weight:700;border:none;border-radius:10px;padding:8px 20px;cursor:pointer}
.b1{background:var(--green);color:#fff}.b2{background:var(--sand2);color:var(--ink)}
.result{background:#fff;border:2px solid var(--green);border-radius:18px;padding:18px;margin-top:18px;text-align:center;display:none}
.result .score{font-size:2.4rem;font-weight:800;color:var(--green)}
.result .st{font-size:.95rem;margin-top:6px}
.gate{background:#fff;border:2px solid var(--line);border-radius:18px;padding:24px;margin-top:18px;text-align:center;font-weight:700;font-size:1.05rem}
.gate a{display:inline-block;margin-top:12px;background:var(--green);color:#fff;text-decoration:none;padding:10px 26px;border-radius:12px}
.dua{margin-top:8px;display:inline-block;background:#e9f4ee;color:var(--green);font-weight:700;border-radius:12px;padding:6px 16px;font-size:.98rem}
/* حماية الاختبار */
body.lock{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.lock img{-webkit-user-drag:none;pointer-events:none}
.wm{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden;opacity:.09;display:none}
.wm div{position:absolute;white-space:nowrap;font-weight:800;font-size:1.25rem;color:#000;transform:rotate(-28deg)}
.cover{position:fixed;inset:0;z-index:40;background:rgba(246,236,220,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;text-align:center;padding:20px}
.cover.on{display:flex}
.cover div{background:#fff;border:2px solid var(--line);border-radius:18px;padding:22px;max-width:380px;font-weight:700}
.cover button{margin-top:12px;font:inherit;font-weight:800;background:var(--green);color:#fff;border:none;border-radius:12px;padding:9px 26px}
@media print{body *{display:none!important}body:after{content:"طباعة الاختبار غير مسموحة";display:block;font-size:24px;text-align:center;margin-top:80px}}
.err{color:var(--red);font-size:.9rem;margin-top:6px;display:none}
@media(max-width:560px){.info{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="title">
      <h1>اختبار الدراسات الاجتماعية</h1>
      <p>اختبار الفترة الثانية – الجزء الأول من المقرر (للفصل الدراسي الأول)</p>
      <div class="dua">استعيني بالله وتوكّلي عليه، وتذكّري أن الله سبحانه وتعالى يسمع ويرى</div>
    </div>
    <div class="info">
      <label>اسم الطالبة<div class="ro" id="sName">—</div></label>
      <label>الصف<div class="ro" id="sClass">—</div></label>
      <label>اليوم<div class="ro" id="dDay"></div></label>

    <div class="meta"><span>زمن الاختبار: <b id="durTxt">٣٥ دقيقة</b></span><span>الدرجة الكلية: <b id="totTop"></b></span><span>المعلمة: وداد محمد الكحيلي</span></div>
  </div>

  <div class="timer"><div id="clock">35:00</div></div>

  <div class="gate" id="gate">جارٍ التحميل…</div>
  <div id="quiz" style="display:none"></div>
  <button class="send" id="sendBtn" style="display:none">إرسال الإجابات ✔</button>

  <div class="result" id="result">
    <div>درجتك</div>
    <div class="score" id="scoreTxt"></div>
    <div id="praise"></div>
    <div class="st" id="sendState"></div>
  </div>
</div>

<div class="wm" id="wm"></div>
<div class="cover" id="cover"></div>
<div class="modal" id="modal"><div class="box"><h3 id="mT"></h3><div id="mB"></div><div class="btns" id="mBtns"></div></div></div>

const $=id=>document.getElementById(id);
const AR="٠١٢٣٤٥٦٧٨٩";
const toEn=s=>s.replace(/[٠-٩]/g,d=>AR.indexOf(d));
function norm(s){return toEn(String(s||"")).replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").trim();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let total=0;
function setTotal(){total=Q.reduce((t,q)=>t+q.items.length,0);$("totTop").textContent=total.toLocaleString("ar-SA")+" درجة";}
setTotal();

/* اليوم والتاريخ */
function setDate(now){
$("dDay").textContent=now.toLocaleDateString("ar-SA",{weekday:"long"});
let hijri="";try{hijri=now.toLocaleDateString("ar-SA-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"});}catch(e){}
$("dDate").textContent=(hijri?hijri+" – ":"")+now.toLocaleDateString("ar-SA-u-ca-gregory",{day:"numeric",month:"numeric",year:"numeric"})+"م";}
setDate(new Date());

/* بناء الأسئلة */
const ans={};
const quiz=$("quiz");
const imgSrc=k=>!k?"":/^(https?:|data:)/.test(k)?k:(IMG[k]||"");
function buildQuiz(){
quiz.innerHTML="";setTotal();
Q.forEach((q,qi)=>{
  const sec=document.createElement("section");sec.className="q";
  sec.innerHTML=`<h2>${q.title} <small>– ${q.hint}</small></h2>`;
  if(q.type==="drag"){
    sec.insertAdjacentHTML("beforeend",`<div class="bank-t">بنك الإجابات (اسحبي الكلمة إلى الفراغ، أو المسيها ثم المسي الفراغ)</div><div class="bank" id="bank${qi}">`+shuffle(q.pool).map(w=>`<span class="chip">${w}</span>`).join("")+`</div>`);
  }
  q.items.forEach((it,ii)=>{
    const id=qi+"_"+ii;
    const d=document.createElement("div");d.className="item";d.id="it"+id;
    let h=`<div class="stem"><span class="num">${(ii+1).toLocaleString("ar-SA")}</span><span>${it.s}</span></div>`;
    if(imgSrc(it.img))h+=`<img src="${imgSrc(it.img)}" alt="${it.cap||""}" title="${it.cap||""}">`;
    if(q.type==="mcq"){h+=`<div class="opts">`+it.o.map((o,oi)=>`<div class="opt" data-v="${oi}">${o}</div>`).join("")+`</div>`;}
    if(q.type==="tf"){h+=`<div class="tf"><div class="opt" data-v="1">صح ✓</div><div class="opt" data-v="0">خطأ ✗</div></div>`;}
    if(q.type==="drag"){h=`<div class="stem dragrow"><span class="num">${(ii+1).toLocaleString("ar-SA")}</span><span>${it.s}</span><span class="slot" data-id="${id}" data-bank="bank${qi}">أفلتي هنا</span></div>`;}
    if(q.type==="short"){h+=`<input class="line" maxlength="70" placeholder="اكتبي إجابتك هنا…" autocomplete="off">`;}
    h+=`<div class="fb"></div>`;
    d.innerHTML=h;sec.appendChild(d);
    d.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{if(done)return;d.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));o.classList.add("sel");ans[id]=o.dataset.v;});
    const sel=d.querySelector("select");if(sel)sel.onchange=()=>ans[id]=sel.value;
    const inp=d.querySelector("input");if(inp)inp.oninput=()=>ans[id]=inp.value;
  });
  quiz.appendChild(sec);
});
}

/* السحب والإفلات (يعمل باللمس والفأرة) */
let picked=null;
function place(chip,slot){
  const id=slot.dataset.id,bank=$(slot.dataset.bank);
  const old=slot.querySelector(".chip"); if(old&&old!==chip) bank.appendChild(old);
  document.querySelectorAll(".slot").forEach(s=>{if(s!==slot&&s.contains(chip)){s.textContent="أفلتي هنا";delete ans[s.dataset.id];}});
  slot.textContent=""; slot.appendChild(chip); ans[id]=chip.textContent;
  chip.classList.remove("pick"); picked=null;
}
function unplace(chip){
  const slot=chip.closest(".slot"); if(!slot)return;
  $(slot.dataset.bank).appendChild(chip); slot.textContent="أفلتي هنا"; delete ans[slot.dataset.id];
}
document.addEventListener("pointerdown",e=>{
  const chip=e.target.closest(".chip"); if(!chip||done)return;
  e.preventDefault();
  const sx=e.clientX,sy=e.clientY; let ghost=null,moved=false,overSlot=null;
  const mv=ev=>{
    if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;
    if(!moved){moved=true;ghost=chip.cloneNode(true);ghost.classList.add("ghost");document.body.appendChild(ghost);chip.style.opacity=".35";}
    ghost.style.left=(ev.clientX-ghost.offsetWidth/2)+"px";ghost.style.top=(ev.clientY-ghost.offsetHeight/2)+"px";
    const el=document.elementFromPoint(ev.clientX,ev.clientY); const s=el&&el.closest(".slot");
    if(overSlot&&overSlot!==s)overSlot.classList.remove("over"); overSlot=s; if(s)s.classList.add("over");
  };
  const up=ev=>{
    document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);
    chip.style.opacity="";
    if(moved){ghost.remove(); if(overSlot){overSlot.classList.remove("over");place(chip,overSlot);} else {const el=document.elementFromPoint(ev.clientX,ev.clientY); if(el&&el.closest(".bank"))unplace(chip);} }
    else{ /* لمسة: اختيار الكلمة أو إرجاعها */
      if(chip.closest(".slot")){unplace(chip);return;}
      document.querySelectorAll(".chip.pick").forEach(c=>c.classList.remove("pick"));
      if(picked===chip){picked=null;}else{picked=chip;chip.classList.add("pick");}
    }
  };
  document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);
});
document.addEventListener("click",e=>{const s=e.target.closest(".slot"); if(s&&picked&&!done&&!e.target.closest(".chip"))place(picked,s);});

/* الطالبة الداخلة من المنصة */
let ME=null; try{ME=JSON.parse(localStorage.getItem("stu")||"null");}catch(e){}
const CLSN={1:"رابع ١",2:"رابع ٢",3:"خامس ١",4:"خامس ٢",5:"خامس ٣",6:"سادس ١",7:"سادس ٢"};
const SB=(PLATFORM.supabaseUrl&&window.supabase)?supabase.createClient(PLATFORM.supabaseUrl,PLATFORM.supabaseKey):null;
const PREVIEW=/[?&]preview/.test(location.search);
function gate(html){$("gate").innerHTML=html;$("gate").style.display="block";}
async function loadContent(){
  if(!SB)return;
  try{const r=await SB.from("quiz_content").select("data").eq("quiz_id",QUIZ_ID).maybeSingle();
    if(r.data&&r.data.data&&Array.isArray(r.data.data.sections))Q=r.data.data.sections;}catch(e){}
}
async function init(){
  await loadContent();buildQuiz();
  if(PREVIEW){ME={sid:"preview",name:"معاينة المعلمة",cls:6,stage:6};document.title="معاينة – "+document.title;}
  if(!ME||!ME.sid){gate('ادخلي إلى منصة الدراسات الاجتماعية أولاً، ثم افتحي الاختبار من صفحتك 🌷<br><a href="index.html">الدخول إلى المنصة</a>');return;}
  $("sName").textContent=ME.name;$("sClass").textContent=CLSN[ME.cls]||"";
  if(+ME.stage!==6){gate("هذا الاختبار خاص بالصف السادس.");return;}
  let G={duration_min:35,until:null,grant_id:"p"};
  if(SB&&!PREVIEW){
    let st=null;try{const r=await SB.rpc("quiz_status",{p_sid:String(ME.sid)});if(r.error)throw r.error;st=(r.data||[]).find(x=>x.quiz_id===QUIZ_ID);}
    catch(e){gate("تعذّر الاتصال بالمنصة، حدّثي الصفحة بعد قليل.");return;}
    if(!st||!st.can_take){
      let lk=false;try{lk=!!localStorage.getItem("lock_"+QUIZ_ID+"_"+ME.sid);}catch(e){}
      if(st&&st.submitted&&lk){gate("🔒 أُقفل هذا الاختبار لأنك خرجتِ من صفحته. لا يُفتح إلا من المعلمة.<br><a href=\"index.html\">العودة إلى صفحتي</a>");return;}
      gate(st&&st.submitted?"✔ سلّمتِ هذا الاختبار، وستظهر درجتك في سجل متابعتك عندما تعتمدها المعلمة.<br><a href=\"index.html\">العودة إلى صفحتي</a>"
        :"🔒 الاختبار غير متاح الآن، وسيظهر لكِ في صفحتك عندما ترسله المعلمة.<br><a href=\"index.html\">العودة إلى صفحتي</a>");return;}
    G=st;
  }
  if(G.sent_at)setDate(new Date(G.sent_at));
  DURATION=(+G.duration_min||35)*60;
  $("durTxt").textContent=(+G.duration_min||35).toLocaleString("ar-SA")+" دقيقة";
  /* إذا بدأت الاختبار من قبل ثم خرجت من الصفحة: يُقفل */
  const KEY="qs_"+QUIZ_ID+"_"+G.grant_id+"_"+ME.sid;let t0=null;
  if(!PREVIEW)try{t0=+localStorage.getItem(KEY)||null;}catch(e){}
  if(t0){LEAVES=1;left=0;$("gate").style.display="none";$("quiz").style.display="block";lockOut();return;}
  gate(`${PREVIEW?'<div style="background:#fff4d6;border-radius:10px;padding:6px;margin-bottom:10px">👁 <b>وضع المعاينة</b>: تظهر لكِ الورقة كما تراها الطالبة، ولا تُرسل الإجابات، وتظهر الإجابات الصحيحة بعد الضغط على «إرسال».</div>':""}<div style="text-align:right;line-height:2">📋 <b>تعليمات الاختبار:</b><br>
   ⏱ مدة الاختبار <b>${(+G.duration_min||35).toLocaleString("ar-SA")} دقيقة</b>، ويُسلَّم تلقائياً عند انتهاء الوقت.<br>
   🪪 الورقة تحمل اسمك.<br>
   🔒 <b>إذا خرجتِ من صفحة الاختبار</b> (إلى تطبيق آخر، أو تبويب آخر، أو الصور، أو إغلاق الصفحة) <b>يُقفل الاختبار فوراً</b> وتُسلَّم ورقتك بما أجبتِ، ولا يُفتح إلا من المعلمة.</div>
   <a href="#" onclick="begin(${JSON.stringify(KEY).replace(/"/g,"&quot;")});return false">ابدئي الاختبار ✏️</a>`);
  window.__G=G;
}
function begin(KEY){
  const G=window.__G,t0=Date.now();if(!PREVIEW)try{localStorage.setItem(KEY,t0);localStorage.removeItem("lock_"+QUIZ_ID+"_"+ME.sid);}catch(e){}
  left=DURATION;
  if(G.until)left=Math.min(left,Math.floor((new Date(G.until)-Date.now())/1000));
  if(left<=0){left=0;$("gate").style.display="none";$("quiz").style.display="block";finish(true);return;}
  $("gate").style.display="none";$("quiz").style.display="block";$("sendBtn").style.display="block";showClock();startTimer();protect();
  window.scrollTo(0,0);
}
/* المؤقت */
let left=0,done=false,tick=null;
const clock=$("clock");
function showClock(){const m=Math.floor(left/60),s=left%60;clock.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(left<=300)clock.classList.add("warn");}
function startTimer(){tick=setInterval(()=>{
  if(done)return;left--;showClock();
  if(left<=0){clearInterval(tick);finish(true);}
},1000);}
/* ===== حماية الاختبار من النسخ والتصوير ===== */
let LEAVES=0,PROT=false;
function protect(){
  PROT=true;document.body.classList.add("lock");
  const wm=$("wm"),txt=(ME.name||"")+" · "+(CLSN[ME.cls]||"")+" · "+new Date().toLocaleDateString("ar-SA");
  let h="";for(let y=-10;y<130;y+=16)for(let x=-30;x<130;x+=45)h+=`<div style="top:${y}%;left:${x+(y%32?20:0)}%">${txt}</div>`;
  wm.innerHTML=h;wm.style.display="block";
  ["copy","cut","paste","contextmenu","selectstart","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{if(PROT&&!(e.target.closest&&e.target.closest("input")&&ev!=="contextmenu"))e.preventDefault();}));
  document.addEventListener("keydown",e=>{if(!PROT)return;const k=(e.key||"").toLowerCase();
    if(k==="printscreen"||((e.ctrlKey||e.metaKey)&&["p","s","c","u"].includes(k))||(e.metaKey&&e.shiftKey)){e.preventDefault();hideQ();try{navigator.clipboard.writeText("");}catch(_){}}});
  document.addEventListener("visibilitychange",()=>{if(PROT&&document.hidden)hideQ();});
  window.addEventListener("blur",()=>{if(PROT)hideQ();});
  window.addEventListener("pagehide",()=>{if(PROT)hideQ();});
}
function hideQ(){if(done)return;
  if(PREVIEW){$("cover").innerHTML='<div>👁 <b>وضع المعاينة</b><br><span style="font-weight:500">عند الطالبة يُقفل الاختبار هنا وتُسلَّم ورقتها.</span><br><button onclick="this.closest(\'.cover\').classList.remove(\'on\')">متابعة المعاينة</button></div>';$("cover").classList.add("on");return;}
  LEAVES++;lockOut();}
function lockOut(){
  $("cover").innerHTML='<div>🔒 <b>أُقفل الاختبار</b><br><span style="font-weight:500">خرجتِ من صفحة الاختبار، فسُلّمت ورقتك بما أجبتِ. لا يُفتح الاختبار مرة أخرى إلا من المعلمة.</span><br><a href="index.html" style="display:inline-block;margin-top:12px;background:var(--brown);color:#fff;text-decoration:none;padding:9px 22px;border-radius:12px">العودة إلى صفحتي</a></div>';
  $("cover").classList.add("on");
  try{localStorage.setItem("lock_"+QUIZ_ID+"_"+ME.sid,"1");}catch(e){}
  finish(true,"left");
}

init();

/* نافذة */
function modal(t,b,btns){$("mT").textContent=t;$("mB").innerHTML=b;const c=$("mBtns");c.innerHTML="";btns.forEach(([txt,cls,fn])=>{const x=document.createElement("button");x.textContent=txt;x.className=cls;x.onclick=()=>{$("modal").classList.remove("on");fn&&fn();};c.appendChild(x);});$("modal").classList.add("on");}

$("sendBtn").onclick=()=>{
  const empty=total-Object.values(ans).filter(v=>String(v).trim()!=="").length;
  modal("تأكيد الإرسال",empty?`لديكِ <b>${empty.toLocaleString("ar-SA")}</b> فقرة بدون إجابة. هل تريدين الإرسال الآن؟`:"هل أنتِ متأكدة من إرسال إجاباتك؟",[["نعم، أرسلي","b1",()=>finish(false)],["أراجع إجاباتي","b2"]]);
};

/* التصحيح */
function finish(auto,reason){
  if(done)return;done=true;clearInterval(tick);
  let score=0;const detail=[];
  Q.forEach((q,qi)=>q.items.forEach((it,ii)=>{
    const id=qi+"_"+ii,v=ans[id],d=$("it"+id),fb=d.querySelector(".fb");let ok=false,right="";
    if(q.type==="mcq"){ok=String(v)===String(it.a);right=it.o[it.a];
      d.querySelectorAll(".opt").forEach(o=>{if(+o.dataset.v===it.a)o.classList.add("ok");else if(o.classList.contains("sel"))o.classList.add("bad");});}
    if(q.type==="tf"){ok=v!==undefined&&(v==="1")===it.a;right=it.a?"صح":"خطأ";
      d.querySelectorAll(".opt").forEach(o=>{if((o.dataset.v==="1")===it.a)o.classList.add("ok");else if(o.classList.contains("sel"))o.classList.add("bad");});}
    if(q.type==="drag"){ok=v===it.a;right=it.a;if(SHOW_RESULT_TO_STUDENT)d.querySelector(".slot").classList.add(ok?"ok":"bad");}
    if(q.type==="short"){const n=norm(v);ok=n.length>0&&it.k.every(g=>g.some(w=>n.includes(norm(w))));right=it.model;d.querySelector("input").classList.add(ok?"ok":"bad");}
    if(ok)score++;
    fb.className="fb "+(ok?"g":"r");fb.textContent=ok?"إجابة صحيحة ✔ (درجة)":"الإجابة الصحيحة: "+right;
    detail.push({q:qi+1,i:ii+1,answer:v??"",correct:ok});
  }));
  document.querySelectorAll("input,select").forEach(e=>e.disabled=true);
  $("result").insertAdjacentHTML("beforeend",'<a href="index.html" style="display:inline-block;margin-top:10px;background:var(--brown);color:#fff;text-decoration:none;padding:8px 22px;border-radius:12px">العودة إلى صفحتي</a>');
  $("sendBtn").style.display="none";
  $("result").style.display="block";
  if(SHOW_RESULT_TO_STUDENT){
    $("scoreTxt").textContent=score.toLocaleString("ar-SA")+" / "+total.toLocaleString("ar-SA");
    const p=score/total;
    $("praise").textContent=p===1?"ممتازة! أداء رائع 🌟":p>=.8?"أحسنتِ! أداء متميز 👏":p>=.6?"جيد، واصلي التقدم 💪":"راجعي الدروس وستتقدمين بإذن الله 🌱";
  }else{
    document.querySelectorAll(".ok,.bad").forEach(e=>e.classList.remove("ok","bad"));
    document.querySelectorAll(".fb").forEach(e=>e.textContent="");
    $("result").firstElementChild.textContent="";
    $("scoreTxt").textContent="✔ تم استلام إجاباتك";
    $("praise").textContent="شكراً لكِ، ستظهر درجتك عندما تعتمدها المعلمة 🌷";
  }
  if(reason==="left")$("praise").textContent="🔒 أُقفل الاختبار لخروجك من صفحته، وسُلّمت ورقتك بما أجبتِ.";
  else if(auto)$("praise").textContent="انتهى الوقت وسُلّمت ورقتك تلقائياً – "+$("praise").textContent;
  $("result").scrollIntoView({behavior:"smooth"});
  PROT=false;
  saveResult({leaves:LEAVES,stage:6,cls:+ME.cls,class_name:CLSN[ME.cls]||"",student_id:String(ME.sid),student_name:ME.name,quiz_id:QUIZ_ID,quiz_title:QUIZ_TITLE,
    score,total,answers:detail,duration_sec:DURATION-Math.max(left,0),auto_submitted:auto,published:false,submitted_at:new Date().toISOString()});
}

/* رصد الدرجة في المنصة */
async function saveResult(r){
  const st=$("sendState");
  try{localStorage.setItem("result_"+QUIZ_ID,JSON.stringify(r));}catch(e){}
  if(!SB||PREVIEW){st.textContent=PREVIEW?"(معاينة: لم تُرسل الورقة)":"";return;}
  st.textContent="جارٍ تسليم الورقة…";
  try{
    const {error}=await SB.from(PLATFORM.table).insert(r);
    if(error)throw error;
    st.textContent="✔ وصلت ورقتك إلى المعلمة.";
  }catch(e){st.textContent="حُفظت إجاباتك، وتعذّر الاتصال بالمنصة الآن. أخبري معلمتك.";}
}
