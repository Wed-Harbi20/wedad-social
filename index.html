/* ---------- ضغط الصور (JPEG فقط، أقل من 600 كيلوبايت) ---------- */
function shrink(file, max, q, limit) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        let scale = Math.min(1, max / Math.max(im.width, im.height)), quality = q;
        const attempt = () => {
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(im.width * scale)); c.height = Math.max(1, Math.round(im.height * scale));
          const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
          c.toBlob(b => {
            if (!b) return rej(new Error('blob'));
            if (b.size > limit && (quality > .4 || scale > .4)) { quality = Math.max(.4, quality - .15); scale *= .85; return attempt(); }
            res(b);
          }, 'image/jpeg', quality);
        };
        attempt();
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

<div class="row"><input id="em" type="email" placeholder="البريد الإلكتروني" style="width:100%" autocomplete="username"></div>

async function sendS() {
  const i = $('ci'); if (!i || busy) return;
  const b = i.value.trim().slice(0, 300); if (!b) return;
  if (/(https?:|www\.|\.(com|net|org|sa|me|io|ly|co|tv|app)\b)/i.test(b)) return alert('الدردشة للكتابة فقط، والروابط غير مسموحة');
  busy = true;
  const r = await sb.rpc('chat_send', { p_token: me.token, p_body: b });
  busy = false;
  const d = r.data || {};
  if (r.error) return alert('تعذّر الإرسال، حاولي مرة أخرى');
  if (d.error === 'links') return alert('الدردشة للكتابة فقط، والروابط غير مسموحة');
  if (d.error === 'closed') { await refreshChat(); return app(); }
  i.value = '';
  await refreshChat(true);
  if (d.closed) app();
  const ni = $('ci'); if (ni) ni.focus();
}
async function addAch(el) {
  const files = [...el.files]; el.value = ''; if (!files.length) return;
  const title = ($('at2').value || '').trim().slice(0, 60);
  for (const f of files) {
    if (!f.type.startsWith('image/')) { alert('يُسمح برفع الصور فقط'); continue; }
    try {
      const blob = await shrink(f, 1280, .8, 600000);
      const path = me.sid + '/' + uid() + '.jpg';
      const up = await sb.storage.from('achievements').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
      if (up.error) throw up.error;
      const r = await sb.rpc('ach_add', { p_token: me.token, p_path: path, p_title: title });
      if (r.error || (r.data && r.data.error)) throw new Error('add');
    } catch (e) { alert('تعذّر رفع الصورة، حاولي مرة أخرى'); }
  }
  const a = await sb.rpc('ach_list', { p_token: me.token });
  if (a.data && !a.data.error) SV.ach = a.data;
  app();
}
function delAch(id) {

async function fetchAll(t, cols, orders) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    let q = sb.from(t).select(cols);
    for (const o of orders) q = q.order(o);
    const r = await q.range(from, from + 999);
    if (r.error) throw r.error;
    out.push(...r.data);
    if (r.data.length < 1000) break;
  }
  return out;
}
async function loadTeacher() {
  const [students, works, grades, ann, rooms] = await Promise.all([
    fetchAll('students', 'id,num,name,cls', ['cls', 'num']),
    fetchAll('works', '*', ['sort_order']),
    fetchAll('grades', 'student_id,work_id,score,note', ['student_id', 'work_id']),
    sb.from('announcements').select('*').order('id', { ascending: false }).then(r => { if (r.error) throw r.error; return r.data; }),
    sb.from('chat_rooms').select('*').then(r => { if (r.error) throw r.error; return r.data; })]);
  D = { students, works, ann, rooms: Object.fromEntries(rooms.map(r => [r.stage, r])) };
  GM = {}; grades.forEach(g => GM[g.student_id + '|' + g.work_id] = g);
  await loadTeacherChat();
}
async function loadTeacherChat() {
  const [m, r] = await Promise.all([
    sb.from('chat_messages').select('*').eq('stage', cs).order('id', { ascending: false }).limit(100),
    sb.from('chat_rooms').select('*').eq('stage', cs).single()]);
  if (!m.error) TM = m.data.reverse();
  if (!r.error) D.rooms[cs] = r.data;
}
const G = (s, w) => GM[s + '|' + w] || {};
const fs = () => fc === 'all' ? D.students : D.students.filter(s => String(s.cls) === String(fc));
const clsSel = () => `<div class="row"><b>الفصل:</b><select onchange="fc=this.value;app()"><option value="all">الكل</option>${CL.map(c => `<option value="${c}" ${String(fc) === String(c) ? 'selected' : ''}>${CN[c]}</option>`).join('')}</select></div>`;
const clsLabel = () => fc === 'all' ? 'جميع الفصول' : CN[fc];
function sum(sid) {
  let sc = 0, mx = 0, wn = 0, wd = 0, done = 0;
  const wt = D.works.reduce((a, w) => a + (+w.weight || 0), 0);
  D.works.forEach(w => { const g = G(sid, w.id); if (g.score != null) { sc += +g.score; mx += +w.max_score; wn += g.score / w.max_score * w.weight; wd += +w.weight; done++; } });
  return { sc, mx, pct: wd ? Math.round(wn / wd * 100) : 0, prog: wt ? Math.round(wn / wt * 100) : 0, done, left: D.works.length - done };
}

  b: ['عمل جيد جداً، بارك الله فيك', 'أحسنتِ، وبقي القليل لتصلي إلى الامتياز', 'مستوى مميّز، واصلي اجتهادك'],
  c: ['عمل جيد، وفّقك الله', 'أنتِ قادرة على الأفضل، واصلي المحاولة', 'جهد مشكور، مع مزيد من التركيز ستتميّزين'],
  d: ['بداية مقبولة، يلزمك مزيد من الاهتمام والمراجعة', 'حاولي مراجعة الدرس لتحسين مستواك', 'أنتِ قادرة على التحسّن، وأنا بجانبك'],
  e: ['لا بأس، تحتاجين إلى مراجعة الدرس وسأساعدك', 'لا تيأسي، حاولي من جديد وسيتحسن مستواك', 'أتمنى أن أراكِ أفضل في المرة القادمة، تواصلي معي']
};
const LN = { a: 'ممتاز', b: 'جيد جداً', c: 'جيد', d: 'مقبول', e: 'يحتاج إلى تحسين' };
const lvl = p => p >= 90 ? 'a' : p >= 80 ? 'b' : p >= 70 ? 'c' : p >= 60 ? 'd' : 'e';
function gradesTab() {

<div class="sc"><table><tr><th>م</th><th>الطالبة</th>${D.works.map(w => `<th>${esc(w.title)}<br><span class="mu">من ${w.max_score}</span></th>`).join('')}</tr>

async function saveRows(rows) {
  const r = await sb.from('grades').upsert(rows, { onConflict: 'student_id,work_id' });
  if (r.error) { alert('تعذّر حفظ الدرجات، تحققي من الاتصال'); return false; }
  rows.forEach(x => { GM[x.student_id + '|' + x.work_id] = { ...(GM[x.student_id + '|' + x.work_id] || {}), ...x }; });
  return true;
}
const ALLPH = new Set(Object.values(PH).flat());
function autoNoteFor(sid, wid, score, max) {
  if (score == null) return null;
  const a = PH[lvl(score / max * 100)]; let h = 0; const s = sid + wid;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return a[h % a.length];
}
function noteIsAuto(sid, wid) { const n = G(sid, wid).note; return !n || ALLPH.has(n); }
async function setG(sid, wid, el) {
  const W = D.works.find(x => x.id === wid); let v = el.value;
  const score = v === '' ? null : Math.max(0, Math.min(+W.max_score, +v));
  if (score !== null) el.value = score;
  const row = { student_id: sid, work_id: wid, score };
  if (noteIsAuto(sid, wid)) row.note = autoNoteFor(sid, wid, score, +W.max_score);
  if (await saveRows([row])) { toast('تم الحفظ ✓'); app(); }
}
async function fillCol(wid) {
  const W = D.works.find(x => x.id === wid), L = fs(); let v = $('f_' + wid).value;
  if (v === '' && L.length) v = G(L[0].id, wid).score ?? '';
  if (v === '') return alert('اكتبي الدرجة أو ضعيها في أول طالبة');
  v = Math.max(0, Math.min(+W.max_score, +v));
  const rows = L.filter(s => fo || G(s.id, wid).score == null).map(s => { const r = { student_id: s.id, work_id: wid, score: v }; if (noteIsAuto(s.id, wid)) r.note = autoNoteFor(s.id, wid, v, +W.max_score); return r; });
  if (rows.length && await saveRows(rows)) app();
}
function clearCol(wid) {
  const L = fs(), W = D.works.find(x => x.id === wid);
  dlg('حذف درجات «' + W.title + '» لـ ' + L.length + ' طالبة (' + clsLabel() + ')؟', null, async () => {
    const r = await sb.from('grades').update({ score: null }).eq('work_id', wid).in('student_id', L.map(s => s.id));
    if (r.error) return alert('تعذّر الحذف');
    const nr = L.filter(s => GM[s.id + '|' + wid] && ALLPH.has(GM[s.id + '|' + wid].note)).map(s => ({ student_id: s.id, work_id: wid, note: null }));
    if (nr.length) await sb.from('grades').upsert(nr, { onConflict: 'student_id,work_id' });
    L.forEach(s => { const k = s.id + '|' + wid; if (GM[k]) { GM[k].score = null; if (ALLPH.has(GM[k].note)) GM[k].note = null; } });
    app();
  });
}
function noteDlg(sid, wid) {
  const W = D.works.find(x => x.id === wid), st = D.students.find(x => x.id === sid), g = G(sid, wid);
  const keys = g.score != null ? [lvl(g.score / W.max_score * 100)] : Object.keys(PH);
  const o = document.createElement('div');
  o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px';
  o.innerHTML = '<div class="card" style="max-width:460px;width:100%;margin:0;max-height:90vh;overflow:auto"><b></b><textarea id="nv" rows="3" style="width:100%;margin:8px 0;font:inherit"></textarea><div class="mu">عبارات التعزيز (اضغطي على عبارة لاختيارها):</div><div id="nc"></div><div class="row" style="margin-top:10px"><button id="nok">حفظ</button><button class="g" id="nno">إلغاء</button></div></div>';
  document.body.appendChild(o);
  o.querySelector('b').textContent = 'ملاحظة لـ ' + st.name + (g.score != null ? ' (' + g.score + '/' + W.max_score + ')' : '');
  const ta = $('nv'); ta.value = g.note || '';
  const nc = $('nc');
  keys.forEach(k => {
    const h = document.createElement('div'); h.className = 'mu'; h.style.margin = '6px 0 2px'; h.textContent = LN[k]; nc.appendChild(h);
    PH[k].forEach(t => { const c = document.createElement('button'); c.className = 'g'; c.style.cssText = 'margin:2px;font-size:.85rem'; c.textContent = t; c.onclick = () => { ta.value = t; }; nc.appendChild(c); });
  });
  $('nno').onclick = () => o.remove();
  $('nok').onclick = async () => { const v = ta.value.trim(); o.remove(); if (await saveRows([{ student_id: sid, work_id: wid, note: v || null }])) app(); };
}
function autoNotes(wid) {
  const W = D.works.find(x => x.id === wid), L = fs().filter(s => G(s.id, wid).score != null && !G(s.id, wid).note);
  if (!L.length) return alert('لا توجد درجات بدون عبارة تعزيز في هذا العمود');
  dlg('إضافة عبارات تعزيز مناسبة للدرجات لـ ' + L.length + ' طالبة في «' + W.title + '» (لن تتغير الملاحظات المكتوبة)؟', null, async () => {
    const rows = L.map((s, i) => { const a = PH[lvl(G(s.id, wid).score / W.max_score * 100)]; return { student_id: s.id, work_id: wid, note: a[i % a.length] }; });
    if (await saveRows(rows)) app();
  });
}

/* ---------- إنجازات الطالبة (عرض للمعلمة) ---------- */
async function showAch(id) {
  const s = D.students.find(x => x.id === id); if (!s) return;
  const o = document.createElement('div');
  o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;overflow:auto;padding:16px';
  o.innerHTML = '<div class="card" style="max-width:720px;margin:0 auto"><div class="top"><h2 style="margin:0"></h2><button class="g">إغلاق</button></div><div class="ag"><p class="mu">جارٍ التحميل…</p></div></div>';
  document.body.appendChild(o);
  o.querySelector('h2').textContent = '📜 إنجازات ' + s.name;
  o.querySelector('button').onclick = () => o.remove();
  const box = o.querySelector('.ag');
  const r = await sb.from('achievements').select('*').eq('student_id', id).order('created_at', { ascending: false });
  if (r.error) { box.innerHTML = '<p class="mu">تعذّر تحميل الإنجازات</p>'; return; }
  box.innerHTML = r.data.length ? '' : '<p class="mu">لم ترفع هذه الطالبة إنجازات بعد</p>';
  r.data.forEach(a => {
    const c = document.createElement('div'); c.className = 'ai';
    c.innerHTML = '<img loading="lazy"><div class="mu"></div><button class="d">حذف</button>';
    const im = c.querySelector('img'); im.src = pub('achievements', a.image_path); im.onclick = () => zoom(im.src);
    c.querySelector('.mu').textContent = (a.title || '') + (a.title ? ' · ' : '') + dt(a.created_at);
    c.querySelector('button').onclick = () => dlg('حذف هذا الإنجاز؟', null, async () => {
      await sb.from('achievements').delete().eq('id', a.id); await sb.storage.from('achievements').remove([a.image_path]); c.remove();
    });
    box.appendChild(c);
  });
}

/* ---------- الطالبات ---------- */
function studentsTab() {
  return `<div class="card"><h2>الطالبات</h2>${clsSel()}<div class="row"><input id="ns" placeholder="اسم الطالبة"><input id="ni" placeholder="رقم الطالبة"><select id="nc">${CL.map(c => `<option value="${c}">${CN[c]}</option>`).join('')}</select><button onclick="addS()">إضافة</button></div>
<div class="sc"><table><tr><th>م</th><th>الرقم</th><th>الاسم</th><th>الفصل</th><th></th></tr>${fs().map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.num)}</td><td>${esc(s.name)} <span style="cursor:pointer" title="إنجازات الطالبة" onclick="showAch('${s.id}')">📜</span></td><td>${CN[s.cls]}</td><td><button class="d" onclick="delS('${s.id}')">حذف</button></td></tr>`).join('')}</table></div></div>`;
}
async function addS() {
  const name = $('ns').value.trim(), num = $('ni').value.trim(), cls = +$('nc').value;
  if (!name || !num) return alert('أدخلي اسماً ورقماً غير مكرر');
  const r = await sb.from('students').insert({ name, num, cls }).select('id,num,name,cls').single();
  if (r.error) return alert('تعذّرت الإضافة، قد يكون الرقم مكرراً');
  D.students.push(r.data); D.students.sort((a, b) => a.cls - b.cls || a.num.localeCompare(b.num)); app();
}
function delS(id) {
  dlg('حذف الطالبة وكل درجاتها؟', null, async () => {
    const r = await sb.from('students').delete().eq('id', id);
    if (r.error) return alert('تعذّر الحذف');
    D.students = D.students.filter(s => s.id !== id); Object.keys(GM).forEach(k => { if (k.startsWith(id + '|')) delete GM[k]; }); app();
  });
}

/* ---------- الأعمال ---------- */
function worksTab() {
  return `<div class="card"><h2>الأعمال</h2><div class="row"><input id="wt" placeholder="اسم العمل"><select id="wy"><option>واجب</option><option>اختبار قصير</option><option>اختبار نهائي</option><option>مشاركة</option><option>تصميم</option><option>مشروع</option></select><input id="wm" type="number" placeholder="الدرجة" style="width:90px"><input id="ww" type="number" placeholder="الوزن" style="width:80px"><input id="wd" type="date"><input id="wh" placeholder="الموعد هجري (اختياري)" style="width:170px"><button onclick="addW()">إضافة</button></div>
<div class="sc"><table><tr><th>العمل</th><th>النوع</th><th>الدرجة</th><th>الوزن</th><th>الموعد</th><th></th></tr>${D.works.map(w => `<tr><td>${esc(w.title)}</td><td>${esc(w.kind)}</td><td>${w.max_score}</td><td>${w.weight}</td><td>${esc(w.due_hijri || w.due || '')}</td><td><button class="d" onclick="delW('${w.id}')">حذف</button></td></tr>`).join('')}</table></div>
<p class="mu">نسبة تقدم الطالبة تُحسب من مجموع أوزان الأعمال، فاجعلي مجموع الأوزان 100.</p></div>`;
}
async function addW() {
  const title = $('wt').value.trim(), max = +$('wm').value, weight = +$('ww').value || max;
  if (!title || !max) return alert('أدخلي اسم العمل والدرجة');
  const so = D.works.reduce((a, w) => Math.max(a, w.sort_order), 0) + 1;
  const r = await sb.from('works').insert({ title, kind: $('wy').value, max_score: max, weight, due: $('wd').value || null, due_hijri: $('wh').value.trim() || null, sort_order: so }).select().single();
  if (r.error) return alert('تعذّرت الإضافة');
  D.works.push(r.data); app();
}
function delW(id) {
  dlg('حذف العمل ودرجاته؟', null, async () => {
    const r = await sb.from('works').delete().eq('id', id);
    if (r.error) return alert('تعذّر الحذف');
    D.works = D.works.filter(w => w.id !== id); Object.keys(GM).forEach(k => { if (k.endsWith('|' + id)) delete GM[k]; }); app();
  });
}

/* ---------- التقارير والتصدير ---------- */
function reportsTab() {
  const r = fs().map(s => ({ n: s.name, ...sum(s.id) })).filter(x => x.done);
  const av = r.length ? Math.round(r.reduce((a, x) => a + x.pct, 0) / r.length) : 0;
  const mx = r.slice().sort((a, b) => b.pct - a.pct), weak = r.filter(x => x.pct < 60);
  return `${clsSel()}<div class="stats"><div class="st"><b>${av}%</b><span>متوسط الأعمال المرصودة</span></div><div class="st"><b>${mx[0] ? mx[0].pct + '%' : '-'}</b><span>الأعلى ${mx[0] ? esc(mx[0].n) : ''}</span></div><div class="st"><b>${mx.length ? mx[mx.length - 1].pct + '%' : '-'}</b><span>الأقل ${mx.length ? esc(mx[mx.length - 1].n) : ''}</span></div></div>
<div class="card"><h2>الطالبات المتعثرات (أقل من 60%)</h2>${weak.map(x => `<div class="an">${esc(x.n)} · ${x.pct}%</div>`).join('') || '<p class="mu">لا توجد حالياً</p>'}</div>
<div class="card"><h2>متوسط كل فصل</h2>${CL.map(c => { const a = D.students.filter(s => s.cls === c).map(s => sum(s.id)).filter(x => x.done); return `<div class="an">${CN[c]} · ${a.length ? Math.round(a.reduce((t, x) => t + x.pct, 0) / a.length) + '%' : 'لا توجد درجات'}</div>`; }).join('')}</div>
<div class="card"><h2>تصدير</h2><button onclick="exp()">تصدير الدرجات (CSV يفتح في Excel)</button></div>`;
}
function exp() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  let c = '﻿' + [q('م'), q('الفصل'), q('الطالبة'), ...D.works.map(w => q(w.title)), q('المجموع'), q('نسبة التقدم')].join(',') + '\n';
  fs().forEach((s, i) => { const m = sum(s.id); c += [q(i + 1), q(CN[s.cls]), q(s.name), ...D.works.map(w => q(G(s.id, w.id).score ?? '')), q(m.sc + '/' + m.mx), q(m.prog + '%')].join(',') + '\n'; });
  const b = new Blob([c], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'grades.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- الإعلانات ---------- */
function annTab() {
  return `<div class="card"><h2>إعلان جديد</h2><div class="row"><input id="at" placeholder="نص الإعلان" style="flex:1"><button onclick="addA()">نشر</button></div>${D.ann.map(a => `<div class="an">${esc(a.body)}<div class="mu">${dt(a.created_at)} <a style="cursor:pointer;color:var(--bad)" onclick="delA(${a.id})">حذف</a></div></div>`).join('') || '<p class="mu">لا توجد إعلانات</p>'}</div>`;
}
async function addA() {
  const t = $('at').value.trim(); if (!t) return;
  const r = await sb.from('announcements').insert({ body: t }).select().single();
  if (r.error) return alert('تعذّر النشر');
  D.ann.unshift(r.data); app();
}
function delA(id) {
  dlg('حذف الإعلان؟', null, async () => { const r = await sb.from('announcements').delete().eq('id', id); if (r.error) return alert('تعذّر الحذف'); D.ann = D.ann.filter(a => a.id !== id); app(); });
}

boot();

</script></body></html>
