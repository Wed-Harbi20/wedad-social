/* ---------- ضغط الصور (JPEG فقط، أقل من 600 كيلوبايت) ---------- */
function shrink(file, max, q, limit) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        let scale = Math.min(1, max / Math.max(im.width, im.height)), quality = q;
        const attempt = () => {
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(im.width * scale)); c.height = Math.max(1, Math.round(im.height * scale));
          const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
          c.toBlob(b => {
            if (!b) return rej(new Error('blob'));
            if (b.size > limit && (quality > .4 || scale > .4)) { quality = Math.max(.4, quality - .15); scale *= .85; return attempt(); }
            res(b);
          }, 'image/jpeg', quality);
        };
        attempt();
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

async function loginS() {
  const u = ($('u').value || '').trim(), p = ($('pwS').value || '').trim(); if (!u || busy) return;
  if (!p) { msg = 'اكتبي كلمة المرور'; app(); return; }
  busy = true; msg = '';
  try {
    const r = await sb.rpc('student_login', { p_name: u, p_password: p });
    const d = r.data;
    if (r.error || !d) msg = 'تعذّر الاتصال، حاولي مرة أخرى';
    else if (d.error === 'ambiguous') msg = 'يوجد أكثر من طالبة بهذا الاسم، أضيفي بقية اسمك كما في كشف الفصل';
    else if (d.error === 'bad_password') msg = 'كلمة المرور غير صحيحة';
    else if (d.error === 'locked') msg = 'تكرّر الخطأ، حاولي بعد 10 دقائق أو اطلبي من معلمتك إعادة كلمة المرور';
    else if (d.error) msg = /[A-Za-z]/.test(u) ? 'اكتبي اسمك بالعربية فقط، كما في كشف الفصل' : 'لم أجد هذا الاسم، اكتبي اسمك كما في كشف الفصل';
    else {
      me = { t: 0, token: d.token, sid: d.sid, name: d.name, cls: d.cls, stage: d.stage };
      localStorage.setItem('stu', JSON.stringify(me));
      if (!(await loadStudent())) { me = null; msg = 'تعذّر تحميل صفحتك'; }
    }
  } catch (e) { msg = 'تعذّر الاتصال، حاولي مرة أخرى'; }
  busy = false; app();
}
async function loginT() {
  const email = ($('em').value || '').trim(), password = $('pw').value || ''; if (!email || !password || busy) return;
  busy = true; msg = '';
  try {
    const r = await sb.auth.signInWithPassword({ email, password });
    if (r.error) msg = 'بيانات الدخول غير صحيحة';
    else {
      const t = await sb.rpc('is_teacher');
      if (t.data !== true) { await sb.auth.signOut(); msg = 'هذا الحساب ليس حساب المعلمة'; }
      else { me = { t: 1 }; roleSet(true); tab = 'chat'; await loadTeacher(); }
    }
  } catch (e) { msg = 'تعذّر الاتصال، حاولي مرة أخرى'; me = null; }
  busy = false; app();
}
async function out() {
  if (me && me.t) { try { await sb.auth.signOut(); } catch (e) { } }
  localStorage.removeItem('stu'); me = null; SV = null; D = null; tm_ = roleGet(); msg = ''; CEL = false; app();
}
function chpw() {
  dlg('كلمة المرور الجديدة (6 أحرف أو أرقام على الأقل):', '', async n => {
    n = (n || '').trim();
    if (n.length < 6) return dlg('يجب أن تكون 6 أحرف أو أرقام على الأقل', null, () => { });
    const r = await sb.auth.updateUser({ password: n });
    dlg(r.error ? 'تعذّر تغيير كلمة المرور' : 'تم تغيير كلمة المرور ✔', null, () => { });
  });
}

function chpwS() {

  b: ['عمل جيد جداً، بارك الله فيك', 'أحسنتِ، وبقي القليل لتصلي إلى الامتياز', 'مستوى مميّز، واصلي اجتهادك'],
  c: ['عمل جيد، وفّقك الله', 'أنتِ قادرة على الأفضل، واصلي المحاولة', 'جهد مشكور، مع مزيد من التركيز ستتميّزين'],
  d: ['بداية مقبولة، يلزمك مزيد من الاهتمام والمراجعة', 'حاولي مراجعة الدرس لتحسين مستواك', 'أنتِ قادرة على التحسّن، وأنا بجانبك'],
  e: ['لا بأس، تحتاجين إلى مراجعة الدرس وسأساعدك', 'لا تيأسي، حاولي من جديد وسيتحسن مستواك', 'أتمنى أن أراكِ أفضل في المرة القادمة، تواصلي معي']
};
const LN = { a: 'ممتاز', b: 'جيد جداً', c: 'جيد', d: 'مقبول', e: 'يحتاج إلى تحسين' };
const lvl = p => p >= 90 ? 'a' : p >= 80 ? 'b' : p >= 70 ? 'c' : p >= 60 ? 'd' : 'e';
function gradesTab() {
  const L = fs();
  return `<div class="card reg"><div class="rh"><span>﷽</span><h2>سجل المتابعة</h2><span>${clsLabel()}</span></div><div class="rb">${clsSel()}
<p class="mu">اكتبي الدرجة وتُحفظ تلقائياً. لتعبئة عمود كامل: اكتبي الدرجة في «للكل» ثم اضغطي ⬇ (أو اتركيها فارغة لنسخ درجة أول طالبة). <label><input type="checkbox" ${fo ? 'checked' : ''} onchange="fo=this.checked"> استبدال الدرجات الموجودة</label></p>
<div class="sc"><table><tr><th>م</th><th>الطالبة</th>${D.works.map(w => `<th>${esc(w.title)}<br><span class="mu">من ${w.max_score}</span></th>`).join('')}</tr>
<tr><td></td><td></td>${D.works.map(w => `<td><input class="gi" id="f_${w.id}" placeholder="للكل"> <button onclick="fillCol('${w.id}')">⬇</button> <button class="d" title="حذف درجات العمود" onclick="clearCol('${w.id}')">🗑</button> <button class="g" title="عبارات تعزيز تلقائية حسب الدرجة" onclick="autoNotes('${w.id}')">💬</button></td>`).join('')}</tr>
${L.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.name)} <span style="cursor:pointer" title="إنجازات الطالبة" onclick="showAch('${s.id}')">📜</span></td>${D.works.map(w => { const g = G(s.id, w.id); return `<td><input class="gi" type="number" min="0" max="${w.max_score}" step="0.5" value="${g.score ?? ''}" onchange="setG('${s.id}','${w.id}',this)"> <span onclick="noteDlg('${s.id}','${w.id}')" style="cursor:pointer" title="${esc(g.note || '')}">${g.note ? '📝' : '✏️'}</span></td>`; }).join('')}</tr>`).join('')}</table></div></div></div>`;
}
async function saveRows(rows) {
  const r = await sb.from('grades').upsert(rows, { onConflict: 'student_id,work_id' });
  if (r.error) { alert('تعذّر حفظ الدرجات، تحققي من الاتصال'); return false; }
  rows.forEach(x => { GM[x.student_id + '|' + x.work_id] = { ...(GM[x.student_id + '|' + x.work_id] || {}), ...x }; });
  return true;
}
const ALLPH = new Set(Object.values(PH).flat());
function autoNoteFor(sid, wid, score, max) {
  if (score == null) return null;
  const a = PH[lvl(score / max * 100)]; let h = 0; const s = sid + wid;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return a[h % a.length];
}
function noteIsAuto(sid, wid) { const n = G(sid, wid).note; return !n || ALLPH.has(n); }
async function setG(sid, wid, el) {
  const W = D.works.find(x => x.id === wid); let v = el.value;
  const score = v === '' ? null : Math.max(0, Math.min(+W.max_score, +v));
  if (score !== null) el.value = score;
  const row = { student_id: sid, work_id: wid, score };
  if (noteIsAuto(sid, wid)) row.note = autoNoteFor(sid, wid, score, +W.max_score);
  if (await saveRows([row])) { toast('تم الحفظ ✓'); app(); }
}
async function fillCol(wid) {
  const W = D.works.find(x => x.id === wid), L = fs(); let v = $('f_' + wid).value;
  if (v === '' && L.length) v = G(L[0].id, wid).score ?? '';
  if (v === '') return alert('اكتبي الدرجة أو ضعيها في أول طالبة');
  v = Math.max(0, Math.min(+W.max_score, +v));
  const rows = L.filter(s => fo || G(s.id, wid).score == null).map(s => { const r = { student_id: s.id, work_id: wid, score: v }; if (noteIsAuto(s.id, wid)) r.note = autoNoteFor(s.id, wid, v, +W.max_score); return r; });
  if (rows.length && await saveRows(rows)) app();
}
function clearCol(wid) {
  const L = fs(), W = D.works.find(x => x.id === wid);
  dlg('حذف درجات «' + W.title + '» لـ ' + L.length + ' طالبة (' + clsLabel() + ')؟', null, async () => {
    const r = await sb.from('grades').update({ score: null }).eq('work_id', wid).in('student_id', L.map(s => s.id));
    if (r.error) return alert('تعذّر الحذف');
    const nr = L.filter(s => GM[s.id + '|' + wid] && ALLPH.has(GM[s.id + '|' + wid].note)).map(s => ({ student_id: s.id, work_id: wid, note: null }));
    if (nr.length) await sb.from('grades').upsert(nr, { onConflict: 'student_id,work_id' });
    L.forEach(s => { const k = s.id + '|' + wid; if (GM[k]) { GM[k].score = null; if (ALLPH.has(GM[k].note)) GM[k].note = null; } });
    app();
  });
}
function noteDlg(sid, wid) {
  const W = D.works.find(x => x.id === wid), st = D.students.find(x => x.id === sid), g = G(sid, wid);
  const keys = g.score != null ? [lvl(g.score / W.max_score * 100)] : Object.keys(PH);
  const o = document.createElement('div');
  o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px';
  o.innerHTML = '<div class="card" style="max-width:460px;width:100%;margin:0;max-height:90vh;overflow:auto"><b></b><textarea id="nv" rows="3" style="width:100%;margin:8px 0;font:inherit"></textarea><div class="mu">عبارات التعزيز (اضغطي على عبارة لاختيارها):</div><div id="nc"></div><div class="row" style="margin-top:10px"><button id="nok">حفظ</button><button class="g" id="nno">إلغاء</button></div></div>';
  document.body.appendChild(o);
  o.querySelector('b').textContent = 'ملاحظة لـ ' + st.name + (g.score != null ? ' (' + g.score + '/' + W.max_score + ')' : '');
  const ta = $('nv'); ta.value = g.note || '';
  const nc = $('nc');
  keys.forEach(k => {
    const h = document.createElement('div'); h.className = 'mu'; h.style.margin = '6px 0 2px'; h.textContent = LN[k]; nc.appendChild(h);
    PH[k].forEach(t => { const c = document.createElement('button'); c.className = 'g'; c.style.cssText = 'margin:2px;font-size:.85rem'; c.textContent = t; c.onclick = () => { ta.value = t; }; nc.appendChild(c); });
  });
  $('nno').onclick = () => o.remove();
  $('nok').onclick = async () => { const v = ta.value.trim(); o.remove(); if (await saveRows([{ student_id: sid, work_id: wid, note: v || null }])) app(); };
}
function autoNotes(wid) {
  const W = D.works.find(x => x.id === wid), L = fs().filter(s => G(s.id, wid).score != null && !G(s.id, wid).note);
  if (!L.length) return alert('لا توجد درجات بدون عبارة تعزيز في هذا العمود');
  dlg('إضافة عبارات تعزيز مناسبة للدرجات لـ ' + L.length + ' طالبة في «' + W.title + '» (لن تتغير الملاحظات المكتوبة)؟', null, async () => {
    const rows = L.map((s, i) => { const a = PH[lvl(G(s.id, wid).score / W.max_score * 100)]; return { student_id: s.id, work_id: wid, note: a[i % a.length] }; });
    if (await saveRows(rows)) app();
  });
}

  return `${clsSel()}<div class="stats"><div class="stx"><b>${av}%</b><span>متوسط الأعمال المرصودة</span></div><div class="st"><b>${mx[0] ? mx[0].pct + '%' : '-'}</b><span>الأعلى ${mx[0] ? esc(mx[0].n) : ''}</span></div><div class="st"><b>${mx.length ? mx[mx.length - 1].pct + '%' : '-'}</b><span>الأقل ${mx.length ? esc(mx[mx.length - 1].n) : ''}</span></div></div>
<div class="card"><h2>الطالبات المتعثرات (أقل من 60%)</h2>${weak.map(x => `<div class="an">${esc(x.n)} · ${x.pct}%</div>`).join('') || '<p class="mu">لا توجد حالياً</p>'}</div>
<div class="card"><h2>متوسط كل فصل</h2>${CL.map(c => { const a = D.students.filter(s => s.cls === c).map(s => sum(s.id)).filter(x => x.done); return `<div class="an">${CN[c]} · ${a.length ? Math.round(a.reduce((t, x) => t + x.pct, 0) / a.length) + '%' : 'لا توجد درجات'}</div>`; }).join('')}</div>
<div class="card"><h2>تصدير</h2><button onclick="exp()">تصدير الدرجات (CSV يفتح في Excel)</button></div>`;
}
function exp() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  let c = '﻿' + [q('م'), q('الفصل'), q('الطالبة'), ...D.works.map(w => q(w.title)), q('المجموع'), q('نسبة التقدم')].join(',') + '\n';
  fs().forEach((s, i) => { const m = sum(s.id); c += [q(i + 1), q(CN[s.cls]), q(s.name), ...D.works.map(w => q(G(s.id, w.id).score ?? '')), q(m.sc + '/' + m.mx), q(m.prog + '%')].join(',') + '\n'; });
  const b = new Blob([c], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'grades.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- الإعلانات ---------- */
function annTab() {
  return `<div class="card"><h2>إعلان جديد</h2><div class="row"><input id="at" placeholder="نص الإعلان" style="flex:1"><button onclick="addA()">نشر</button></div>${D.ann.map(a => `<div class="an">${esc(a.body)}<div class="mu">${dt(a.created_at)} <a style="cursor:pointer;color:var(--bad)" onclick="delA(${a.id})">حذف</a></div></div>`).join('') || '<p class="mu">لا توجد إعلانات</p>'}</div>`;
}
async function addA() {
  const t = $('at').value.trim(); if (!t) return;
  const r = await sb.from('announcements').insert({ body: t }).select().single();
  if (r.error) return alert('تعذّر النشر');
  D.ann.unshift(r.data); app();
}
function delA(id) {
  dlg('حذف الإعلان؟', null, async () => { const r = await sb.from('announcements').delete().eq('id', id); if (r.error) return alert('تعذّر الحذف'); D.ann = D.ann.filter(a => a.id !== id); app(); });
}

boot();

</script></body></html>
